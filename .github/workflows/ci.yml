name: tests

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.9", "3.11", "3.13"]
        include:
          # One Windows run, because that is where most users of this will be.
          - os: windows-latest
            python-version: "3.11"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Self-check
        # Validates every stage of the paper's method against synthetic ground
        # truth. If this fails, nothing downstream is worth running.
        env:
          MPLBACKEND: Agg
        run: python -m fatigueppg.selfcheck

      - name: Tests
        env:
          MPLBACKEND: Agg
        run: python -m pytest -q

      - name: Inference on the bundled example
        env:
          MPLBACKEND: Agg
        run: |
          python -m fatigueppg.infer --input examples/demo_ppg_200hz.csv
          python -m fatigueppg.infer --demo

  quickstart:
    # The whole extract -> train -> infer path, on synthetic data.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - env:
          MPLBACKEND: Agg
        run: bash scripts/quickstart.sh
